function healthColour(cls,points=0){const classic={good:'#008858',bad:'#d90935',pending:'#e9a000',future:'#adb5b9'};if(settings.indicatorMode!=='gradient'||cls==='pending'||cls==='future')return classic[cls]||classic.pending;const intensity=Math.min(Math.max(points,1),21)/21;return cls==='good'?`hsl(148,${(38+intensity*40).toFixed(1)}%,${(63-intensity*34).toFixed(1)}%)`:`hsl(350,${(48+intensity*32).toFixed(1)}%,${(72-intensity*33).toFixed(1)}%)`;}

function render(){persist();root.dataset.page=view;root.dataset.teamstyle=settings.teamStyle||'tint';const p=prefs[view];q('.games').hidden=view!=='games';q('.bets').hidden=view!=='bets';q('.feed').hidden=view!=='feed';q('.stats').hidden=view!=='stats';root.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let active=Object.entries(p).filter(([k,v])=>!['sort','dir','compact','range'].includes(k)&&v!=='All'&&!(view==='bets'&&k==='status'&&v==='Open')&&!(view==='feed'&&k==='scope'&&v==='My games')).length;q('.filters').innerHTML=`<div class="singletoolbar"><button data-density="1" aria-label="Toggle full and compact view"><i data-lucide="${p.compact?'grid-3x3':'rows-3'}"></i>${p.compact?'Compact':'Full'}</button><button data-options="settings" aria-label="Settings"><i data-lucide="settings-2"></i></button><button data-options="filters"><i data-lucide="sliders-horizontal"></i>Filter${active?' · '+active:''}</button><button data-options="sort"><i data-lucide="arrow-up-down"></i>Sort</button></div>`;
if(view==='games'){const visible=games.filter(gamePass).sort((a,b)=>(gameSort(a)-gameSort(b))*p.dir);q('.games').classList.toggle('gridgames',p.compact);q('.games').innerHTML=visible.map(p.compact?miniCard:gameCard).join('')||'<div class="empty">'+(games.length?'No games match':'Waiting for ESPN fixtures…')+'</div>';}
else if(view==='bets'){const visible=bets.map((b,i)=>({...b,index:i})).filter(betPass).sort((a,b)=>{let x=betSort(a),y=betSort(b);return (typeof x==='string'?x.localeCompare(y):x-y)*p.dir;});q('.bets').classList.toggle('compactbets',p.compact);q('.bets').innerHTML=visible.map(b=>betCard(b,p.compact)).join('')||'<div class="empty">No bets match</div>';}else if(view==='stats')renderStats();else renderFeed();redesignChrome();renderBack();icons();updateDraft();}
const feedEvents=[];
try {const cache=JSON.parse(localStorage.getItem('endzone-espn-cache')||'null');if(cache&&Array.isArray(cache.events))feedEvents.push(...cache.events);}catch(e){}
function eventImpacts(ev){return bets.map((b,index)=>({...b,index})).filter(b=>b.legs.some(l=>l.game===ev.game)&&(!b.addedAt||!ev.timestamp||b.addedAt<=ev.timestamp)).map(b=>{if(b.legs.some(l=>EndzoneMarkets.type(l)!=='win'))return{b,before:NaN,after:NaN,delta:NaN};const compute=p=>100*b.legs.reduce((n,l)=>{const wp=l.game===ev.game?p:ev.probs?.[l.game];return n*(Number.isFinite(wp)?(l.side==='away'?wp:100-wp)/100:NaN);},1),before=compute(ev.p0),after=compute(ev.p1);return{b,before,after,delta:after-before};});}
function impactDots(imp,g,side){return imp.filter(x=>marketVisible(x.b,'indicators')).filter(x=>x.b.legs.some(l=>l.game===g.id&&EndzoneMarkets.involves(l,side))).map(x=>{const health=betHealth(x.b);return `<button class="dotbutton" data-jump="${x.b.index}" aria-label="${code(g,side)}: ${esc(x.b.name)}, current accumulator ${health.label}"><i class="statusdot ${health.cls}" style="--indicator-colour:${health.colour}"></i></button>`;}).join('');}
function renderFeed(){const p=prefs.feed;const visible=feedEvents.filter(ev=>(EndzoneStats.has(p.scope,'All')||bets.some(b=>b.legs.some(l=>l.game===ev.game)))&&EndzoneStats.has(p.type,ev.kind)&&EndzoneStats.any(p.bet,eventImpacts(ev).map(x=>x.b.name))).sort((a,b)=>(p.sort==='Time'?a.timestamp-b.timestamp:game(a.game).a.localeCompare(game(b.game).a))*p.dir);q('.feed').classList.toggle('compactfeed',p.compact);q('.feed').innerHTML=visible.map(ev=>{const g=game(ev.game),imp=eventImpacts(ev),open=feedOpen.has(ev.id),amount=ev.now[ev.team==='away'?0:1]-ev.old[ev.team==='away'?0:1];return `<article class="event livecard" data-event="${ev.id}" data-game="${g.id}"><div class="livematch"><button class="liveteam" data-side="away" aria-label="Add ${g.a} to betslip">${logo(g.a)}<b>${g.a}</b></button><button class="livecenter" data-gamejump="${g.id}" aria-label="Open ${g.a} at ${g.h}"><b><span class="${ev.team==='away'?'good':''}">${ev.now[0]}</span> - <span class="${ev.team==='home'?'good':''}">${ev.now[1]}</span></b><small>${ev.clock.replace(' · ',' ')}</small></button><button class="liveteam" data-side="home" aria-label="Add ${g.h} to betslip">${logo(g.h)}<b>${g.h}</b></button></div><div class="liveprob"><span>${g.a} <b>${pct(ev.p1)}</b></span><span class="probtrack"><i class="good" style="width:${Number.isFinite(ev.p1)?ev.p1:0}%"></i></span><span>${g.h} ${pct(Number.isFinite(ev.p1)?100-ev.p1:NaN)}</span></div><div class="livescoreevent"><div class="liveawaydots">${impactDots(imp,g,'away')}</div><button class="liveplay" data-feedtoggle="${ev.id}" aria-expanded="${open}" aria-label="${code(g,ev.team)} ${ev.label||ev.kind}; ${imp.length} affected bets"><span>${logo(code(g,ev.team))}${ev.label||ev.kind}</span></button><div class="livehomedots">${impactDots(imp,g,'home')}</div><button class="liveexpand" data-feedtoggle="${ev.id}" aria-label="Toggle affected bets" aria-expanded="${open}"><i data-lucide="${open?'chevron-up':'chevron-down'}"></i></button></div><div class="live-scorer" title="${esc(ev.description||'')}">${ev.scorer?esc(ev.scorer)+(ev.qb?' · QB '+esc(ev.qb):'')+(ev.distance?' · '+esc(ev.distance)+' yd':''):esc(ev.description||'')}</div><div class="liveexpanded" ${open?'':'hidden'}>${imp.filter(x=>marketVisible(x.b,'details')).map(x=>`<section class="livebet"><button class="livebettitle" data-jump="${x.b.index}"><b>${esc(x.b.name)}</b><span class="livebetmetrics"><small class="livebetchange ${x.delta>0?'good':x.delta<0?'bad':'pending'}" title="Win chance change in percentage points">${Number.isFinite(x.delta)?(x.delta>0?'+':'')+x.delta.toFixed(1)+'pp':'—'}</small><span class="livebetreturn"><strong class="livebetchance" title="Win chance after this event">${pct(x.after)}</strong><span>${money(returnOf(x.b)).replace('.00','')}</span></span></span></button>${x.b.legs.map(l=>{if(EndzoneMarkets.type(l)!=='win')return '<span class="market-live-current">Current market progress</span>'+marketLegRow(l,l.game===ev.game);const lg=game(l.game),isHere=l.game===ev.game,a=isHere?ev.now[0]:lg.as,h=isHere?ev.now[1]:lg.hs,d=l.side==='away'?a-h:h-a,cl=lg.state==='upcoming'?'future':d>0?'good':d<0?'bad':'pending';return `<button class="livebetleg ${isHere?'affectedleg':''}" data-gamejump="${lg.id}" ${isHere?'aria-label="Affected leg: '+code(lg,l.side)+'"':''}>${logo(code(lg,l.side))}<b class="${cl}">${code(lg,l.side)}</b><span>${lg.state==='upcoming'?'@':l.side==='away'?a+' – '+h:h+' – '+a}</span><span>${code(lg,l.side==='away'?'home':'away')}</span><b class="${cl}">${lg.state==='upcoming'?'—':d>0?'+'+d:d}</b></button>`;}).join('')}</section>`).join('')||'<small>No linked bets</small>'}</div></article>`;}).join('')||'<div class="empty">'+(EndzoneStats.selected(p.scope).includes('My games')?'No scoring plays for your tracked games yet. Choose All in Filters to see every game.':'No scoring plays yet.')+'</div>';}
function redesignChrome(){root.querySelectorAll('nav button').forEach(b=>{const v=b.dataset.view;b.innerHTML=`${v==='games'?'<svg class="navfootball" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21C1 12 12 1 21 3C23 12 12 23 3 21Z"/><path d="M4 13L11 20M13 4L20 11M8 16L16 8M9 11L13 15M12 8L16 12"/></svg>':`<i data-lucide="${v==='bets'?'ticket':v==='stats'?'chart-no-axes-combined':'radio'}"></i>`}<span>${v==='games'?'Games':v==='bets'?'Bets':v==='stats'?'Stats':'Live'}</span>`;});q('header').innerHTML=`<b class="endzone-brand"><img src="endzone-wordmark.png" alt="Endzone"></b><div class="redesigntools">${view==='bets'?'<button class="addbet" aria-label="Add accumulator"><i data-lucide="plus"></i></button>':''}<button data-options="filters" aria-label="Filters"><i data-lucide="filter"></i></button><button data-options="sort" aria-label="Sort"><i data-lucide="arrow-up-down"></i></button><button data-density="1" aria-label="Toggle compact view" aria-pressed="${prefs[view].compact}"><i data-lucide="list-filter"></i></button><button class="refresh" aria-label="Refresh scores"><i data-lucide="refresh-cw"></i></button></div>`;q('.filters').innerHTML=`<div class="feedconnection" role="status">${esc(connectionText())}</div>`+(view==='bets'?`<div class="ledgergrid ledgerlabels" role="group" aria-label="Sort bets"><span class="betidentityheading">${sortHeading('Name','Bet')}<span class="statuscounts">${['good','bad','pending'].map((cl,i)=>`<span class="${cl}" title="${['Ahead','Behind','Level or waiting'][i]}">${bets.filter(b=>b.state==='open'&&betHealth(b).cls===cl).length}</span>`).join('')}</span></span>${sortHeading('Chance','Win %')}${sortHeading('Points gap','Needs')}${sortHeading('Return','Return')}<span></span></div>`:'');}
function sortHeading(key,label){const active=prefs.bets.sort===key;return `<button class="betsort ${active?'active':''}" data-betsort="${key}" aria-label="Sort by ${label}${active?', currently '+(prefs.bets.dir===1?'ascending':'descending'):''}">${label}<span aria-hidden="true">${active?(prefs.bets.dir===1?'↑':'↓'):'↕'}</span></button>`;}
function setBetSort(key){prefs.bets.dir=prefs.bets.sort===key?-prefs.bets.dir:key==='Name'?1:-1;prefs.bets.sort=key;render();}

function editBet(index){const original=bets[index];if(!original)return;editor={original,name:original.name,stake:original.stake??'',odds:original.odds??'',returnOverride:original.returnOverride??'',legs:original.legs.map(l=>({...l}))};renderEditor();q('.beteditor').hidden=false;}
function captureEditor(){if(!editor)return;editor.name=q('.editbetname').value;editor.stake=q('.editbetstake').value;editor.odds=q('.editbetodds').value;editor.returnOverride=q('.editbetpayout').value;}
function renderEditor(){const available=[...new Map([...games,...editor.legs.map(l=>game(l.game))].map(g=>[g.id,g])).values()];q('.editbetbody').innerHTML=`<label>Bet name<input class="editbetname" value="${esc(editor.name)}"></label><div class="inputs"><label>Stake (£)<input class="editbetstake" type="text" min="0.01" step="0.01" inputmode="decimal" enterkeyhint="done" value="${esc(editor.stake)}"></label><label>Total decimal odds<input class="editbetodds" type="text" min="1" step="0.01" inputmode="text" enterkeyhint="done" value="${esc(editor.odds)}"></label></div><label>Payout (£), if stake or odds unknown<input class="editbetpayout" type="text" min="0.01" step="0.01" inputmode="decimal" enterkeyhint="done" value="${esc(editor.returnOverride)}"></label><div class="editbetselections">${editor.legs.map((l,i)=>`<div class="edit-selection-row"><div><b>${esc(selectionTeam(l))}</b><small>${esc(selectionTitle(l))} · ${esc(game(l.game).a)} @ ${esc(game(l.game).h)}</small></div><button data-compose-editor="${i}">Edit selection</button><button data-editlegremove="${i}" aria-label="Remove selection">×</button></div>`).join('')}</div><button class="editaddleg" data-editaddleg="1">+ Add selection</button><div class="editbetwarning warning" role="alert"></div><button class="continue" data-saveedit="1">Save changes</button>`;icons();}
function saveEditedBet(){if(!editor)return false;captureEditor();const stake=String(editor.stake).trim()?numericValue(editor.stake):null,odds=String(editor.odds).trim()?EndzoneMarkets.parseOdds(editor.odds):null,payout=numericValue(editor.returnOverride);let error='';if(!editor.legs.length)error='Add at least one selection.';else if(editor.legs.some(l=>!EndzoneMarkets.validate(l)))error='Complete every player and market requirement.';else if(new Set(editor.legs.map(legKey)).size!==editor.legs.length)error='Select each team and market only once.';else if((stake!==null&&(!Number.isFinite(stake)||stake<=0))||(odds!==null&&(!Number.isFinite(odds)||odds<1))||(!(Number.isFinite(stake)&&Number.isFinite(odds))&&!(Number.isFinite(payout)&&payout>0)))error='Enter stake and odds, or a known payout.';if(error){q('.editbetwarning').textContent=error;return false;}const bet=editor.original;if(!bets.includes(bet))return false;const previousName=bet.name;const changed=JSON.stringify(bet.legs)!==JSON.stringify(editor.legs);Object.assign(bet,{name:editor.name.trim()||editor.legs.map(l=>code(game(l.game),l.side)).join('-'),stake,odds,legs:editor.legs.map(l=>({...l}))});if(Number.isFinite(stake)&&Number.isFinite(odds))delete bet.returnOverride;else bet.returnOverride=payout;if(changed){bet.addedAt=Date.now();bet.state=EndzoneMarkets.settle(bet,game);}if(prefs.feed.bet===previousName)prefs.feed.bet=bet.name;q('.beteditor').hidden=true;editor=null;render();return true;}
function deleteBet(index){const bet=bets[index];if(!bet)return;deletedBet={bet,index};bets.splice(index,1);expanded.clear();backStack=[];if(prefs.feed.bet===bet.name)prefs.feed.bet='All';q('.beteditor').hidden=true;editor=null;render();}
function undoDelete(){if(!deletedBet)return;bets.splice(Math.min(deletedBet.index,bets.length),0,deletedBet.bet);deletedBet=null;expanded.clear();render();}
q('.beteditor').addEventListener('click',e=>{if(e.target===q('.beteditor')){q('.beteditor').hidden=true;editor=null;}});
root.addEventListener('change',e=>{if(!editor)return;const el=e.target;captureEditor();if(el.dataset.editgame!==undefined){editor.legs[Number(el.dataset.editgame)]={...editor.legs[Number(el.dataset.editgame)],game:el.value,side:'away'};renderEditor();}if(el.dataset.editside!==undefined)editor.legs[Number(el.dataset.editside)].side=el.value;if(el.dataset.editmarket!==undefined)editor.legs[Number(el.dataset.editmarket)].market=el.value;});

function scoreContents(g,loading=false,error=''){const qs=g.quarters||[],count=Math.max(4,qs.length),heads=Array.from({length:count},(_,i)=>i<4?'Q'+(i+1):'OT'+(i>4?i-3:''));return `<small class="boxclock">${esc(g.clock)}${loading?' · Updating ESPN…':''}</small>${g.state==='upcoming'?'<p class="score-note">Game has not started. Quarter scores appear after kickoff.</p>':''}${error?`<p class="warning">${esc(error)}</p>`:''}<table aria-label="Quarter scores"><thead><tr><th></th>${heads.map(h=>`<th>${h}</th>`).join('')}<th>Total</th></tr></thead><tbody>${['away','home'].map((side,i)=>`<tr><th>${esc(code(g,side))}</th>${heads.map((_,n)=>`<td>${qs[n]?.[i]??'—'}</td>`).join('')}<td><b>${g.state==='upcoming'?'—':score(g,side)}</b></td></tr>`).join('')}</tbody></table>${g.teamStats?.length?`<table class="team-stat-table" aria-label="Team statistics"><thead><tr><th>Team stats</th><th>${g.a}</th><th>${g.h}</th></tr></thead><tbody>${g.teamStats.map(x=>`<tr><th>${esc(x.label)}</th><td>${esc(x.away)}</td><td>${esc(x.home)}</td></tr>`).join('')}</tbody></table>`:''}`;}

let sheetDrag=null;
root.addEventListener('touchstart',e=>{const sheet=e.target.closest('.sheet'),panel=e.target.closest('.panel');if(!sheet||!panel||e.touches.length!==1||e.target.closest('input,select,textarea,button')){sheetDrag=null;return;}const header=e.target.closest('.draghandle,.panelhead');if(header||panel.scrollTop<=0)sheetDrag={sheet,panel,x:e.touches[0].clientX,y:e.touches[0].clientY,d:0};},{passive:true});

function addExistingBet(index){const b=bets[index];if(!b)return;const empty=!draft.length;for(const l of b.legs){if(draft.some(x=>legKey(x)===legKey(l)))continue;if(EndzoneMarkets.type(l)==='win')draft=draft.filter(x=>x.game!==l.game||EndzoneMarkets.type(x)!=='win');draft.push(JSON.parse(JSON.stringify(l)));}if(empty){draftName=b.name;nameEdited=true;slipConfig.mode='single';q('.stake').value=Number.isFinite(b.stake)?b.stake:'';q('.odds').value=Number.isFinite(b.odds)?b.odds:'';q('.known-return').value=Number.isFinite(b.returnOverride)?b.returnOverride:'';}else{q('.odds').value='';q('.known-return').value='';}q('.existing-sheet').hidden=true;q('.slip').hidden=false;q('.warning').textContent='Selections copied. Your saved bet is unchanged.';updateDraft();persist();}
function openExisting(){q('.slip').hidden=true;q('.existing-body').innerHTML=bets.length?bets.map((b,i)=>`<button class="existing-bet" data-copybet="${i}"><b>${esc(b.name)}</b><small>${b.legs.length} selections · ${esc(b.legs.map(l=>code(game(l.game),l.side)).join(' / '))}</small><span>Add to betslip +</span></button>`).join(''):'<div class="empty">No saved bets yet</div>';q('.existing-sheet').hidden=false;}
function renderSystem(){const system=slipConfig.mode==='system';q('.slip-mode').value=system?'system':'single';q('.odds').closest('label').hidden=system;q('.stake').closest('label').firstChild.textContent=system?'Stake per bet':'Stake';q('.fold-controls').hidden=!system;q('.draftprob').hidden=system;q('.known-return-label').hidden=system;q('.single-odds-note').hidden=system;if(!system)q('.single-odds-note').textContent=Number.isFinite(computedDraftOdds())?'Selection odds multiply to '+computedDraftOdds().toFixed(4)+'. Enter total odds or bookmaker return to override.':'Enter total odds (decimal or fractional), or odds on every selection.';q('.fold-size').innerHTML=Array.from({length:Math.max(0,draft.length-1)},(_,i)=>`<option value="${i+1}" ${Number(slipConfig.size)===i+1?'selected':''}>${i+1===1?'Singles':(i+1)+'-folds'}</option>`).join('');if(system){if(!Number.isInteger(Number(slipConfig.size))||slipConfig.size<1||slipConfig.size>=draft.length)slipConfig.size=Math.max(1,draft.length-1);q('.fold-size').value=String(slipConfig.size);}updateSystemSummary();}
function updateSystemSummary(){const system=slipConfig.mode==='system';q('.system-summary').hidden=!system;if(!system){q('.save').textContent='Confirm bet';q('.estimate>span').textContent='Potential return';return;}q('.estimate>span').textContent='Maximum combined return';try{if(draft.length<2)throw Error('Add at least two selections for a system bet.');const combos=EndzoneMarkets.combinations(draft,Number(slipConfig.size)),stake=numericValue(q('.stake').value);let folds=null;try{folds=EndzoneMarkets.systemBets(draft,Number(slipConfig.size),stake);}catch(e){}q('.system-summary').innerHTML=`<b>${combos.length} × ${slipConfig.size}-fold${combos.length===1?'':'s'}</b><p>Total stake: ${money(stake*combos.length)} · ${money(stake)} per bet</p><small>Return includes stake. Each fold uses only its included selections. Maximum assumes every selection wins. Returns are estimates from the entered odds; bookmaker precision or boosts may differ.</small>${folds?`<div class="fold-preview">${folds.map((f,i)=>`<div><span>${i+1}. ${f.legs.map(selectionTitle).join(' · ')}</span><b>${money(f.return)}</b></div>`).join('')}</div>`:'<p>Enter the individual decimal odds for every selection to calculate each return.</p>'}`;q('.return').textContent=folds?money(folds.reduce((n,f)=>n+f.return,0)):'—';q('.save').textContent='Create '+combos.length+' bets';}catch(e){q('.system-summary').textContent=e.message;q('.return').textContent='—';q('.save').textContent='Create system bets';}}
function computedDraftOdds(){return draft.length&&draft.every(l=>Number.isFinite(l.odds)&&l.odds>1)?draft.reduce((v,l)=>v*l.odds,1):NaN;}
function saveDraft(){const stake=numericValue(q('.stake').value),knownReturn=numericValue(q('.known-return').value),odds=EndzoneMarkets.parseOdds(q('.odds').value)||computedDraftOdds()||(Number.isFinite(knownReturn)&&stake>0?knownReturn/stake:NaN),name=q('.name').value.trim()||draft.map(l=>code(game(l.game),l.side)).join('-');let entries;try{if(!draft.length)throw Error('Add a selection.');if(slipConfig.mode!=='system'&&q('.odds').value.trim()&&(!Number.isFinite(EndzoneMarkets.parseOdds(q('.odds').value))||EndzoneMarkets.parseOdds(q('.odds').value)<1))throw Error('Enter valid decimal or fractional total odds.');if(slipConfig.mode!=='system'&&q('.known-return').value.trim()&&(!Number.isFinite(knownReturn)||knownReturn<=0))throw Error('Enter a valid positive bookmaker return.');if(draft.some(l=>!EndzoneMarkets.validate(l)))throw Error('Complete every selection.');if(slipConfig.mode==='system'){if(draft.length<2)throw Error('Add at least two selections.');entries=EndzoneMarkets.systemBets(draft,Number(slipConfig.size),stake);const groupId='system-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);entries=entries.map((f,i)=>({name:name+' · '+slipConfig.size+'-fold '+(i+1)+'/'+entries.length,stake:f.stake,odds:f.odds,returnOverride:f.return,legs:f.legs,system:{groupId,size:Number(slipConfig.size),count:entries.length,entry:i+1}}));}else{if(!Number.isFinite(stake)||stake<=0||!Number.isFinite(odds)||odds<1)throw Error('Enter stake and total odds.');entries=[{name,stake,odds,...(Number.isFinite(knownReturn)&&knownReturn>0?{returnOverride:knownReturn}:{}),legs:JSON.parse(JSON.stringify(draft))}];}}catch(e){q('.warning').textContent=e.message;return;}bets.push(...entries.map(b=>({...b,state:EndzoneMarkets.settle(b,game),addedAt:Date.now()})));draft=[];draftName='';nameEdited=false;slipConfig.mode='single';q('.known-return').value='';q('.name').value='';q('.warning').textContent='';q('.slip').hidden=true;view='bets';Object.assign(prefs.bets,{status:'Open',phase:'All',health:'All',size:'All',team:'All',sort:'Added',dir:-1});render();}

function selectionSides(l){return EndzoneMarkets.sides(l);}

function defaultRequirement(id,side='away'){return {game:id,side,market:'win'};}

async function loadComposePlayers(){if(!compose)return;const id=compose.game,request=++composeRequest,g=game(id);try{if(!g.aid||!g.hid)await EndzoneEspn.detail(g);const players=await EndzoneEspn.roster(g);game(id).roster=players;if(compose&&compose.game===id&&request===composeRequest){for(const row of q('.compose-body').querySelectorAll('.requirement-row')){const side=row.querySelector('.requirement-side').value,list=row.querySelector('datalist');if(list)list.innerHTML=players.filter(p=>p.side===side).map(p=>'<option value="'+esc(p.name)+'">'+esc(p.position||'')+'</option>').join('');}persist();}}catch(e){if(compose&&compose.game===id){const note=q('.compose-roster-note');if(note)note.textContent='Player suggestions unavailable. Enter the full player name; live progress remains unconfirmed until ESPN can match it.';}}}

function renderCompose(){const g=game(compose.game),available=[...new Map([...games,g].map(x=>[x.id,x])).values()].sort((a,b)=>a.time-b.time),playerDefs=Object.entries(EndzoneMarkets.definitions).filter(([k,d])=>d.player),teamDefs=Object.entries(EndzoneMarkets.definitions).filter(([k,d])=>k!=='win'&&!d.player&&!d.combo);q('.compose-body').innerHTML=`<p class="composer-intro">One priced selection. Add requirements below for a combined market; every requirement must succeed. Different selections can use different games and markets.</p><label>Game<select class="compose-game">${available.map(x=>`<option value="${x.id}" ${compose.game===x.id?'selected':''}>${esc(x.a)} @ ${esc(x.h)} · ${new Date(x.time).toLocaleDateString('en-GB',{timeZone:'Europe/London',day:'numeric',month:'short'})}</option>`).join('')}</select></label><div class="requirements">${compose.conditions.map((c,i)=>{const isPlayer=EndzoneMarkets.definitions[c.market]?.player,players=[...new Map([...(g.roster||[]),...(g.playerStats||[])].filter(x=>x.side===c.side).map(p=>[p.name,p])).values()];return `<section class="requirement-row"><div class="requirement-head"><b>Requirement ${i+1}</b>${compose.conditions.length>1?`<button data-remove-requirement="${i}" aria-label="Remove requirement ${i+1}">Remove</button>`:''}</div><label>Market<select class="requirement-market"><option value="win" ${c.market==='win'?'selected':''}>Team to win</option><optgroup label="Player props">${playerDefs.map(([k,d])=>`<option value="${k}" ${c.market===k?'selected':''}>${esc(d.label)}</option>`).join('')}</optgroup><optgroup label="Team scoring">${teamDefs.map(([k,d])=>`<option value="${k}" ${c.market===k?'selected':''}>${esc(d.label)}</option>`).join('')}</optgroup></select></label><label>Team<select class="requirement-side"><option value="away" ${c.side==='away'?'selected':''}>${g.a}</option><option value="home" ${c.side==='home'?'selected':''}>${g.h}</option></select></label>${isPlayer?`<label>Player<input class="requirement-player" list="players-${i}" placeholder="Full player name" value="${esc(c.player?.name||'')}" autocomplete="off"><datalist id="players-${i}">${players.map(p=>`<option value="${esc(p.name)}">${esc(p.position||'')}</option>`).join('')}</datalist></label><label>At least<input class="requirement-target" inputmode="numeric" enterkeyhint="done" type="number" min="1" max="2000" step="1" value="${c.target||1}"><small>${esc(EndzoneMarkets.definitions[c.market].unit)} · ${c.market.includes('TD')?'1 for anytime TD, 2 for 2+ TD':'Enter the milestone, such as 60 or 250'}</small></label>`:''}</section>`;}).join('')}</div><button class="market-launch" data-add-requirement="1" ${compose.conditions.length>=8?'disabled':''}>+ Add requirement to this selection</button><label>Quoted odds for this whole selection <small>optional for an ordinary accumulator</small><input class="compose-odds" inputmode="text" enterkeyhint="done" placeholder="3/1 or 4.00" value="${esc(compose.odds)}"></label><p class="compose-roster-note">Player progress uses ESPN records. Passing TDs belong in the passing-TD market; they do not count as a QB scoring a touchdown. Missing player data stays unconfirmed.</p><div class="compose-error warning" role="alert"></div><button class="continue" data-save-composed="1">${compose.target?'Update selection':'Add selection to betslip'}</button>`;icons();}
function saveCompose(){captureCompose();const odds=EndzoneMarkets.parseOdds(compose.odds);let l=compose.conditions.length===1?{...compose.conditions[0]}:{game:compose.game,side:compose.conditions[0].side,market:'combo',conditions:JSON.parse(JSON.stringify(compose.conditions))};if(compose.odds.trim()&&(!Number.isFinite(odds)||odds<=1)){q('.compose-error').textContent='Enter fractional odds such as 3/1 or decimal odds above 1.';return;}if(Number.isFinite(odds))l.odds=odds;if(!EndzoneMarkets.validate(l)){q('.compose-error').textContent='Complete player names and positive whole-number targets. Each requirement must be different.';return;}const target=compose.target,list=target?.type==='editor'?editor.legs:draft;if(list.some((x,i)=>legKey(x)===legKey(l)&&i!==(target?.index??-1))){q('.compose-error').textContent='This selection is already present.';return;}if(target)list[target.index]=l;else list.push(l);q('.compose-sheet').hidden=true;compose=null;if(target?.type==='editor'){editor.odds='';editor.returnOverride='';renderEditor();q('.beteditor').hidden=false;}else{q('.known-return').value='';q('.odds').value='';q('.warning').textContent='';updateDraft();persist();q('.slip').hidden=false;}}
function manualResultMarkup(b,i){const index=Number.isInteger(b.index)?b.index:bets.indexOf(b);if(index<0)return '';const l=b.legs[i];return `<label class="manual-result">Settlement<select data-leg-result="${i}" data-result-bet="${index}"><option value="" ${!l.result?'selected':''}>Auto (ESPN)</option><option value="won" ${l.result==='won'?'selected':''}>Confirm won</option><option value="lost" ${l.result==='lost'?'selected':''}>Confirm lost</option></select></label>`;}
q('.app').insertAdjacentHTML('beforeend','<div class="sheet compose-sheet" hidden><section class="panel"><div class="panelhead"><b>Build selection</b><button class="close" aria-label="Close selection builder">×</button></div><div class="compose-body"></div></section></div><div class="sheet json-slip-sheet" hidden><section class="panel"><div class="panelhead"><b>Import a bet draft</b><button class="close" aria-label="Close bet draft import">×</button></div><p class="composer-intro">Paste an Endzone bet draft made from your screenshot. This opens a draft for review before saving.</p><textarea class="bet-json-input" rows="10" placeholder="Paste bet JSON"></textarea><div class="json-slip-error warning" role="alert"></div><button class="continue" data-read-bet-json="1">Review in betslip</button></section></div>');
q('.slip .market-launch').insertAdjacentHTML('beforebegin','<button class="market-launch main-selection-launch" data-open-compose="1">+ Add team, player or combined selection</button><button class="market-launch" data-open-bet-json="1">Paste bet draft JSON</button>');
q('.slip .inputs').insertAdjacentHTML('afterend','<label class="known-return-label">Bookmaker return (£) <small>optional; overrides calculated return</small><input class="known-return" inputmode="decimal" enterkeyhint="done" placeholder="e.g. 16.50"></label>');
q('.odds').inputMode='text';q('.odds').placeholder='Decimal or fractional (3/1)';
function readBetJSON(){try{const raw=JSON.parse(q('.bet-json-input').value),source=Array.isArray(raw.bets)?raw.bets.length===1?raw.bets[0]:null:raw;if(!source||!Array.isArray(source.legs)||!source.legs.length||source.legs.length>64)throw Error('Paste one bet with 1–64 selections.');const mapped=source.legs.map(l=>{const copy=JSON.parse(JSON.stringify(l));if(!copy.game&&copy.away&&copy.home){const matches=games.filter(g=>g.a===copy.away&&g.h===copy.home&&(!copy.date||new Date(g.time).toISOString().slice(0,10)===copy.date));if(matches.length!==1)throw Error('Fixture '+copy.away+' @ '+copy.home+' needs an exact game ID or date.');copy.game=matches[0].id;}if(!games.some(g=>g.id===copy.game))throw Error('A fixture was not found in loaded games.');if(copy.market==='combo')copy.conditions=(copy.conditions||[]).map(c=>({...c,game:copy.game}));if(typeof copy.odds==='string')copy.odds=EndzoneMarkets.parseOdds(copy.odds);if(!EndzoneMarkets.validate(copy))throw Error('A selection has missing or invalid market, player, team or target details.');return copy;});if(new Set(mapped.map(legKey)).size!==mapped.length)throw Error('The draft contains duplicate selections.');draft=mapped;draftName=String(source.name||'Imported screenshot bet').slice(0,150);nameEdited=true;slipConfig.mode='single';q('.stake').value=source.stake??'';q('.odds').value=source.odds??'';q('.known-return').value=source.returnOverride??source.return??'';q('.warning').textContent='Review every selection, fixture, odds and return before saving.';q('.json-slip-sheet').hidden=true;q('.slip').hidden=false;updateDraft();persist();}catch(e){q('.json-slip-error').textContent=e.message||'Could not read bet JSON.';}}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('close')&&b.closest('.compose-sheet'))cancelCompose();if(b.classList.contains('close')&&b.closest('.json-slip-sheet'))q('.slip').hidden=false;if(b.dataset.openCompose)openCompose();if(b.dataset.composeDraft!==undefined)openCompose({type:'draft',index:Number(b.dataset.composeDraft)});if(b.dataset.composeEditor!==undefined)openCompose({type:'editor',index:Number(b.dataset.composeEditor)});if(b.dataset.addRequirement){captureCompose();compose.conditions.push(defaultRequirement(compose.game));renderCompose();}if(b.dataset.removeRequirement!==undefined){captureCompose();compose.conditions.splice(Number(b.dataset.removeRequirement),1);renderCompose();}if(b.dataset.saveComposed)saveCompose();if(b.dataset.openBetJson){q('.slip').hidden=true;q('.json-slip-sheet').hidden=false;}if(b.dataset.readBetJson)readBetJSON();});
root.addEventListener('change',e=>{if(e.target.matches('.compose-game')){compose.game=e.target.value;compose.conditions=[defaultRequirement(compose.game)];compose.odds='';renderCompose();loadComposePlayers();}if(e.target.matches('.requirement-market,.requirement-side')){captureCompose();renderCompose();}if(e.target.dataset.legResult!==undefined){const b=bets[Number(e.target.dataset.resultBet)],l=b?.legs[Number(e.target.dataset.legResult)];if(l){if(e.target.value)l.result=e.target.value;else delete l.result;b.state=EndzoneMarkets.settle(b,game);render();}}});
q('.known-return').addEventListener('input',updateDraft);

document.addEventListener('click',e=>{if(!root.contains(e.target))dismiss();});q('.games').addEventListener('scroll',dismiss);q('.stake').addEventListener('input',updateDraft);q('.odds').addEventListener('input',updateDraft);render();refreshScores(true);
})();
</script>
