<script>
(()=>{
const root=document.getElementById('ez-compact'),q=s=>root.querySelector(s);
const games=[
{id:'car',a:'CAR',an:'Panthers',h:'ATL',hn:'Falcons',as:10,hs:7,p:62,clock:'Q2 · 04:29',state:'live',ball:'away',time:1800,quarters:[[7,3],[3,4],[null,null],[null,null]]},
{id:'phi',a:'PHI',an:'Eagles',h:'TEN',hn:'Titans',as:7,hs:7,p:71,clock:'Q2 · 12:49',state:'live',ball:'home',time:1800,quarters:[[7,7],[0,0],[null,null],[null,null]]},
{id:'min',a:'MIN',an:'Vikings',h:'CHI',hn:'Bears',as:3,hs:14,p:24,clock:'Q3 · 09:12',state:'live',ball:'away',time:1800,quarters:[[3,7],[0,7],[0,0],[null,null]]},
{id:'gb',a:'GB',an:'Packers',h:'NYJ',hn:'Jets',as:21,hs:10,p:86,clock:'Q4 · 05:08',state:'live',ball:'home',time:1800,quarters:[[7,0],[7,3],[0,7],[7,0]]},
{id:'kc',a:'KC',an:'Chiefs',h:'DEN',hn:'Broncos',as:0,hs:0,p:64,clock:'21:25 · Today',state:'upcoming',time:2125},
{id:'sea',a:'SEA',an:'Seahawks',h:'LAR',hn:'Rams',as:0,hs:0,p:42,clock:'21:05 · Today',state:'upcoming',time:2105},
{id:'dal',a:'DAL',an:'Cowboys',h:'HOU',hn:'Texans',as:17,hs:24,p:0,clock:'Final',state:'final',time:1800,quarters:[[7,7],[3,7],[7,3],[0,7]]}];
const leg=(game,side)=>({game,side,market:'win'});
let bets=[
{name:'Sunday fourfold',stake:2,odds:13.5,state:'open',legs:[leg('car','away'),leg('phi','away'),leg('min','away'),leg('gb','away')]},
{name:'Home double',stake:1,odds:7,state:'open',legs:[leg('car','home'),leg('phi','home')]},
{name:'Comebacks',stake:1,odds:5,state:'open',legs:[leg('car','home'),leg('min','away')]},
{name:'Packers & Panthers',stake:2,odds:3.2,state:'open',legs:[leg('gb','away'),leg('car','away')]},
{name:'Late double',stake:1,odds:4.8,state:'open',legs:[leg('kc','away'),leg('sea','home')]},
{name:'Cowboys & Eagles',stake:1,odds:4.5,state:'lost',legs:[leg('dal','away'),leg('phi','away')]},
{name:'Texans single',stake:2,odds:1.9,state:'won',legs:[leg('dal','home')]},
{name:'Cowboys & Chiefs',stake:1,odds:4,state:'lost',legs:[leg('dal','away'),leg('kc','away')]}];
const settings={scores:true,percent:true};
let draftName='',nameEdited=false;
let view='games',draft=[],expanded=new Set(),gameOpen=new Set(),backStack=[];
const prefs={feed:{scope:'My games',type:'All',bet:'All',sort:'Time',dir:-1,compact:false},games:{status:'All',linked:'All',health:'All',sort:'Kickoff',dir:1,compact:false,team:'All'},bets:{status:'Open',phase:'All',health:'All',size:'All',sort:'Chance',dir:-1,compact:false,team:'All'}};
function persist(){try{localStorage.setItem('endzone-v1',JSON.stringify({bets,draft,prefs,settings,draftName,nameEdited}));}catch(e){}}
try{const saved=JSON.parse(localStorage.getItem('endzone-v1')||'null');if(saved){if(Array.isArray(saved.bets)&&saved.bets.every(b=>Array.isArray(b.legs)&&b.legs.every(l=>games.some(g=>g.id===l.game))))bets=saved.bets;if(Array.isArray(saved.draft))draft=saved.draft.filter(l=>games.some(g=>g.id===l.game));draftName=typeof saved.draftName==='string'?saved.draftName:'';nameEdited=Boolean(saved.nameEdited);if(saved.settings)Object.assign(settings,saved.settings);if(saved.prefs)for(const v of ['games','bets','feed'])Object.assign(prefs[v],saved.prefs[v]||{});}}catch(e){}
window.endzoneBack=()=>{const sheet=[...root.querySelectorAll('.sheet')].find(s=>!s.hidden);if(sheet){sheet.hidden=true;return true;}if(backStack.length){root.querySelector('[data-back]')?.click();return true;}if(view!=='games'){view='games';render();return true;}return false;};
const game=id=>games.find(g=>g.id===id),code=(g,s)=>s==='away'?g.a:g.h,score=(g,s)=>s==='away'?g.as:g.hs;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'£'+n.toFixed(2),margin=l=>{const g=game(l.game);return score(g,l.side)-score(g,l.side==='away'?'home':'away');};
function signal(l){const g=game(l.game),d=margin(l);return{cls:g.state==='upcoming'?'future':d>0?'good':d<0?'bad':'pending',text:g.state==='upcoming'?'—':d>0?'+'+d:d<0?String(d):'0'};}
function probability(l){const g=game(l.game);return (l.side==='away'?g.p:100-g.p)/100;}
const chance=legs=>(settings.percent?Math.round(100*legs.reduce((p,l)=>p*probability(l),1)):Number((100*legs.reduce((p,l)=>p*probability(l),1)).toFixed(1)));
const betChance=b=>b.state==='lost'?0:b.state==='won'?100:chance(b.legs);
const linked=(id,side)=>bets.map((b,i)=>({...b,index:i})).filter(b=>b.state==='open'&&b.legs.some(l=>l.game===id&&(!side||l.side===side)));
const gap=b=>b.legs.reduce((n,l)=>n+(game(l.game).state!=='upcoming'&&margin(l)<=0?1-margin(l):0),0);
function record(b){const played=b.legs.filter(l=>game(l.game).state!=='upcoming');return [played.filter(l=>margin(l)>0).length,played.filter(l=>margin(l)<0).length,played.filter(l=>margin(l)===0).length];}
function strips(legs,context,points=false,compact=false){return `<span class="legpills ${compact?'minimalpills':''}">${legs.map(l=>{const s=signal(l),g=game(l.game),current=l.game===context;return `<span class="legpill ${current?'currentleg':''}" aria-label="${code(g,l.side)} ${g.state==='upcoming'?'upcoming':s.text+' point margin'}${current?', this game':''}">${compact?'':`<small>${code(g,l.side)}</small>`}<span class="pillmark ${s.cls}">${points&&!compact?s.text:''}</span></span>`;}).join('')}</span>`;}
function teamBets(id,side){const list=linked(id,side);return `<div class="teamlinks"><b class="teamlinkslabel">${code(game(id),side)}</b>${list.length?list.map(b=>`<button class="healthbet" data-jump="${b.index}"><span class="healthname">${esc(b.name)}</span><span class="healthmetrics"><b>${betChance(b)}%</b><span>${money(b.stake*b.odds)}</span></span>${strips(b.legs,id)}</button>`).join(''):'<small class="nolinks">—</small>'}</div>`;}
function gameDetails(id){return '<div class="teamcolumns">'+teamBets(id,'away')+teamBets(id,'home')+'</div>';}
function icons(){if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:16,height:16}});}
q('header').innerHTML='<b>ENDZONE</b><div class="headtools"><small>4 LIVE · DEMO</small><button class="refresh" aria-label="Refresh scores"><i data-lucide="refresh-cw"></i></button></div>';
q('nav').innerHTML='<button class="active" data-view="games">Games</button><button data-view="bets">Bets</button><button data-view="feed">Live</button>';
q('.games').insertAdjacentHTML('afterend','<div class="bets" hidden></div><div class="feed" hidden></div>');
q('.inputs').insertAdjacentHTML('beforebegin','<label class="betname">Name<input class="name" placeholder="My accumulator"></label>');
q('.app').insertAdjacentHTML('beforeend','<div class="sheet options" hidden><section class="panel"><div class="panelhead"><b class="optiontitle"></b><button class="close" aria-label="Close options"><i data-lucide="x"></i></button></div><div class="optionbody"></div><button class="continue optionsdone">Done</button></section></div>');
function gamePass(g){const p=prefs.games,list=linked(g.id);return (p.status==='All'||g.state===({Live:'live',Upcoming:'upcoming',Final:'final'})[p.status])&&(p.linked==='All'||(p.linked==='My games'?list.length>0:list.length===0))&&(p.health==='All'||(p.health==='Close'?g.state==='live'&&Math.abs(g.as-g.hs)<=7:list.some(b=>b.legs.some(l=>l.game===g.id&&margin(l)<0&&g.state==='live'))))&&(p.team==='All'||g.a===p.team||g.h===p.team);}
function betPass(b){const p=prefs.bets,r=record(b);return (p.status==='All'||b.state===p.status.toLowerCase())&&(p.phase==='All'||b.legs.some(l=>game(l.game).state===({Live:'live',Upcoming:'upcoming',Final:'final'})[p.phase]))&&(p.health==='All'||(p.health==='Behind'?r[1]>0:p.health==='Level'?r[2]>0:r[1]===0&&r[2]===0&&b.legs.every(l=>game(l.game).state!=='upcoming')))&&(p.size==='All'||(p.size==='Single'?b.legs.length===1:p.size==='2–3'?b.legs.length>=2&&b.legs.length<=3:b.legs.length>=4))&&(p.team==='All'||b.legs.some(l=>code(game(l.game),l.side)===p.team));}
function gameSort(g){const p=prefs.games;return p.sort==='Kickoff'?g.time:p.sort==='Bets'?linked(g.id).length:p.sort==='Points gap'?Math.abs(g.as-g.hs):p.sort==='Win %'?Math.max(g.p,100-g.p):linked(g.id).reduce((n,b)=>n+b.stake*b.odds,0);}
function betSort(b){const p=prefs.bets;return p.sort==='Chance'?betChance(b):p.sort==='Points gap'?gap(b):p.sort==='Return'?b.stake*b.odds:p.sort==='Stake'?b.stake:p.sort==='Legs'?b.legs.length:p.sort==='Name'?b.name.toLowerCase():b.index;}

'My games','No bets'],health:['All','Close','Behind'],team:['All',...teams]}:{status:['All','Open','Won','Lost'],phase:['All','Live','Upcoming','Final'],health:['All','Ahead','Behind','Level'],size:['All','Single','2–3','4+'],team:['All',...teams]};const labels={status:'Status',linked:'Bets',health:'Score',phase:'Games',size:'Legs',team:'Team',sort:'Order'};q('.optionbody').innerHTML=Object.entries(groups).map(([k,values])=>`<div class="optiongroup"><small>${labels[k]}</small><div>${values.map(v=>`<button data-pref="${k}" data-value="${v}" aria-pressed="${p[k]===v}" class="${p[k]===v?'on':''}">${v}</button>`).join('')}</div></div>`).join('')+(type==='sort'?`<div class="optiongroup"><small>Direction</small><div><button data-setdir="1" class="${p.dir===1?'on':''}">Ascending</button><button data-setdir="-1" class="${p.dir===-1?'on':''}">Descending</button></div></div>`:'<button class="resetfilters">Clear filters</button>');q('.options').dataset.type=type;q('.options').hidden=false;icons();}
function updateDraft(){if(!nameEdited)draftName=draft.map(l=>code(game(l.game),l.side)).join('-');if(q('.name').value!==draftName)q('.name').value=draftName;root.querySelectorAll('.team').forEach(b=>{const selected=draft.some(l=>l.game===b.closest('article').dataset.game&&l.side===b.dataset.side);b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));});q('.count').textContent=draft.length;q('.chance').textContent=draft.length?chance(draft)+'%':'—';q('.picks').innerHTML=draft.length?draft.map((l,i)=>`<div class="pick"><span>${code(game(l.game),l.side)} win</span><button data-remove="${i}" aria-label="Remove selection">×</button></div>`).join(''):'<div class="empty">No selections</div>';q('.slipchance').textContent=draft.length?chance(draft)+'%':'—';const stake=Number(q('.stake').value),odds=Number(q('.odds').value);q('.return').textContent=stake>0&&odds>=1?'Return '+money(stake*odds):'Return —';}
function dismiss(){root.querySelectorAll('.bubble').forEach(el=>el.remove());}
function bubble(card,id,side){dismiss();const div=document.createElement('div');div.className='bubble';div.innerHTML=`<div class="bubblehead"><b>${code(game(id),side)}</b><button data-dismiss="1" aria-label="Close linked bets">×</button></div>${teamBets(id,side)}`;q('.app').appendChild(div);const appRect=q('.app').getBoundingClientRect(),rect=card.getBoundingClientRect();div.style.top=Math.max(65,Math.min(rect.bottom-appRect.top-20,appRect.height-div.offsetHeight-110))+'px';}
function showBox(id,card){if(!settings.scores)return;dismiss();const g=game(id),qs=g.quarters||[[null,null],[null,null],[null,null],[null,null]],quarter=g.clock.startsWith('Q')?Number(g.clock[1]):0;const div=document.createElement('div');div.className='bubble boxscore';div.innerHTML=`<div class="bubblehead"><b>${g.a} ${g.state==='upcoming'?'@':g.as+' - '+g.hs} ${g.h}</b><button data-dismiss="1" aria-label="Close box score">×</button></div><small class="boxclock">${g.clock}</small><table aria-label="Quarter scores"><thead><tr><th></th>${[1,2,3,4].map(n=>`<th class="${n===quarter?'currentquarter':''}">Q${n}</th>`).join('')}<th>Total</th></tr></thead><tbody>${['away','home'].map((side,i)=>`<tr><th>${code(g,side)}</th>${qs.map((scores,n)=>`<td class="${n+1===quarter?'currentquarter':''}">${scores[i]===null?'—':scores[i]}</td>`).join('')}<td><b>${g.state==='upcoming'?'—':score(g,side)}</b></td></tr>`).join('')}</tbody></table>`;q('.app').appendChild(div);const r=card.getBoundingClientRect(),a=q('.app').getBoundingClientRect();div.style.top=Math.max(65,Math.min(r.bottom-a.top-12,a.height-div.offsetHeight-110))+'px';}
root.addEventListener('click',e=>{if(!e.target.closest('.bubble')&&!e.target.closest('[data-count]')&&!e.target.closest('[data-boxscore]'))dismiss();const b=e.target.closest('button');if(!b)return;
if(b.dataset.view){view=b.dataset.view;backStack=[];render();}
if(b.dataset.back){const prev=backStack.pop();if(prev){view=prev.view;Object.assign(prefs,prev.prefs);render();q('.'+view).scrollTop=prev.scroll;}}
if(b.dataset.quick){prefs[view].status=b.dataset.quick;render();}
if(b.dataset.options)options(b.dataset.options);
if(b.dataset.setting){settings[b.dataset.setting]=!settings[b.dataset.setting];render();options('settings');}
if(b.dataset.boxscore)showBox(b.dataset.boxscore,b.closest('article'));
if(b.dataset.pref){prefs[view][b.dataset.pref]=b.dataset.value;render();options(q('.options').dataset.type);}
if(b.dataset.setdir){prefs[view].dir=Number(b.dataset.setdir);render();options('sort');}
if(b.dataset.direction){prefs[view].dir*=-1;render();}
if(b.dataset.density){prefs[view].compact=!prefs[view].compact;render();}
if(b.classList.contains('resetfilters')){const p=prefs[view];Object.keys(p).filter(k=>!['sort','dir','compact'].includes(k)).forEach(k=>p[k]='All');render();options('filters');}
if(b.dataset.side){const id=b.closest('article').dataset.game;if(game(id).state==='final'){q('.done').textContent='Game finished';return;}const side=b.dataset.side,existing=draft.findIndex(l=>l.game===id&&l.side===side);draft=draft.filter(l=>l.game!==id);if(existing<0)draft.push(leg(id,side));updateDraft();persist();}
if(b.classList.contains('close'))b.closest('.sheet').hidden=true;
if(b.classList.contains('optionsdone'))q('.options').hidden=true;
if(b.classList.contains('slipbar')){updateDraft();q('.slip').hidden=false;}
if(b.dataset.remove!==undefined){draft.splice(Number(b.dataset.remove),1);updateDraft();persist();}
if(b.dataset.count)bubble(b.closest('article'),b.closest('article').dataset.game,b.dataset.count);
if(b.dataset.dismiss)dismiss();
if(b.dataset.jump!==undefined)jump('bets',Number(b.dataset.jump));
if(b.dataset.details){const id=b.dataset.details,scroll=q('.games').scrollTop;gameOpen.has(id)?gameOpen.delete(id):gameOpen.add(id);render();q('.games').scrollTop=scroll;}
if(b.dataset.bet!==undefined){const i=Number(b.dataset.bet),scroll=q('.bets').scrollTop;expanded.has(i)?expanded.delete(i):expanded.add(i);render();q('.bets').scrollTop=scroll;}
if(b.dataset.gamejump||b.dataset.miniexpand)jump('games',b.dataset.gamejump||b.dataset.miniexpand);
if(b.classList.contains('refresh')){b.classList.add('refreshed');b.setAttribute('aria-label','Refreshed · demo scores');setTimeout(()=>b.classList.remove('refreshed'),600);}
if(b.classList.contains('save')){const stake=Number(q('.stake').value),odds=Number(q('.odds').value);if(!draft.length||!Number.isFinite(stake)||stake<=0||!Number.isFinite(odds)||odds<1){q('.warning').textContent=!draft.length?'Add a selection.':'Enter stake and total odds.';return;}bets.push({name:q('.name').value.trim()||draft.map(l=>code(game(l.game),l.side)).join('-'),stake,odds,state:'open',trackedAfter:demoEvents.length,legs:draft.map(l=>({...l}))});draft=[];draftName='';nameEdited=false;q('.name').value='';q('.warning').textContent='';q('.slip').hidden=true;view='bets';Object.assign(prefs.bets,{status:'Open',phase:'All',health:'All',size:'All',team:'All',sort:'Added',dir:-1});render();}
});

q('.name').value=draftName;
q('.name').addEventListener('input',()=>{draftName=q('.name').value;nameEdited=Boolean(draftName.trim());persist();});
function closeSlip(){document.activeElement?.blur();q('.slip').hidden=true;persist();}
q('.slip .panel').insertAdjacentHTML('afterbegin','<div class="draghandle" aria-label="Swipe down to close"><span></span></div>');
let swipe=null;
root.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0];swipe={x:t.clientX,y:t.clientY,target:e.target,time:Date.now()};},{passive:true});
root.addEventListener('touchend',e=>{if(!swipe||!e.changedTouches.length)return;const t=e.changedTouches[0],dx=t.clientX-swipe.x,dy=t.clientY-swipe.y,start=swipe;swipe=null;
 if(Date.now()-start.time>1000)return;
 if(!q('.slip').hidden){if(dy>65&&Math.abs(dy)>Math.abs(dx)*1.5&&(start.target.closest('.draghandle,.panelhead')||(q('.slip .panel').scrollTop===0&&!start.target.closest('input,button'))))closeSlip();return;}
 if(root.querySelector('.sheet:not([hidden])')||start.target.closest('input,.bubble,.boxscore'))return;
 if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.6){const pages=['games','bets','feed'],next=pages.indexOf(view)+(dx<0?1:-1);if(next>=0&&next<pages.length){dismiss();view=pages[next];render();}}
},{passive:true});
root.addEventListener('click',e=>{if(e.target.closest('.slip .close'))closeSlip();});
q('.slip').addEventListener('click',e=>{if(e.target===q('.slip'))closeSlip();});
function fitViewport(){const h=window.visualViewport?.height||window.innerHeight;root.style.setProperty('--app-height',h+'px');}
window.visualViewport?.addEventListener('resize',fitViewport);window.addEventListener('resize',fitViewport);fitViewport();
root.addEventListener('focusin',e=>{if(e.target.matches('input'))setTimeout(()=>e.target.scrollIntoView({block:'nearest',behavior:'smooth'}),250);});

document.addEventListener('click',e=>{if(!root.contains(e.target))dismiss();});q('.games').addEventListener('scroll',dismiss);q('.stake').addEventListener('input',updateDraft);q('.odds').addEventListener('input',updateDraft);render();
})();
