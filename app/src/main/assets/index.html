grow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid #edf1ee;font-size:12px}#ez-compact .legrow small{display:block;color:#69766e;font-size:11px;margin-bottom:2px}#ez-compact .gap{white-space:nowrap;font-weight:700}#ez-compact .good{color:#087c40}#ez-compact .bad{color:#bb3b51}#ez-compact .pending{color:#85670b}#ez-compact .bethead{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:none;padding:0;color:inherit}#ez-compact .bethead strong{font-size:14px}#ez-compact .bethead small{display:block;margin-top:4px;font-size:11px;color:#68786e}#ez-compact .betprob{font-size:18px;font-weight:700}#ez-compact .segments{display:flex;gap:3px;margin:9px 0 6px;height:4px}#ez-compact .segments i{flex:1;border-radius:3px;background:#c9d3cc}#ez-compact .segments i.good{background:#087c40}#ez-compact .segments i.bad{background:#bb3b51}#ez-compact .segments i.pending{background:#d5a629}#ez-compact .betfoot{display:flex;justify-content:space-between;font-size:11px;color:#617066}#ez-compact .betlegs{margin-top:6px}#ez-compact .slipbar{margin-top:8px;padding:11px}#ez-compact .done:empty{padding:0}#ez-compact .betname{margin-top:10px}#ez-compact .markets button{padding:11px 6px}#ez-compact .empty{padding:20px;text-align:center;font-size:13px;color:#64736a}

<script>
(()=>{
const root=document.getElementById('ez-compact'),q=s=>root.querySelector(s);
const games=[
{id:'car',a:'CAR',an:'Panthers',h:'ATL',hn:'Falcons',as:10,hs:7,p:62,clock:'Q2 · 04:29',state:'live',ball:'away',time:1800,quarters:[[7,3],[3,4],[null,null],[null,null]]},
{id:'phi',a:'PHI',an:'Eagles',h:'TEN',hn:'Titans',as:7,hs:7,p:71,clock:'Q2 · 12:49',state:'live',ball:'home',time:1800,quarters:[[7,7],[0,0],[null,null],[null,null]]},
{id:'min',a:'MIN',an:'Vikings',h:'CHI',hn:'Bears',as:3,hs:14,p:24,clock:'Q3 · 09:12',state:'live',ball:'away',time:1800,quarters:[[3,7],[0,7],[0,0],[null,null]]},
{id:'gb',a:'GB',an:'Packers',h:'NYJ',hn:'Jets',as:21,hs:10,p:86,clock:'Q4 · 05:08',state:'live',ball:'home',time:1800,quarters:[[7,0],[7,3],[0,7],[7,0]]},
{id:'kc',a:'KC',an:'Chiefs',h:'DEN',hn:'Broncos',as:0,hs:0,p:64,clock:'21:25 · Today',state:'upcoming',time:2125},
{id:'sea',a:'SEA',an:'Seahawks',h:'LAR',hn:'Rams',as:0,hs:0,p:42,clock:'21:05 · Today',state:'upcoming',time:2105},
{id:'dal',a:'DAL',an:'Cowboys',h:'HOU',hn:'Texans',as:17,hs:24,p:0,clock:'Final',state:'final',time:1800,quarters:[[7,7],[3,7],[7,3],[0,7]]}];
const leg=(game,side)=>({game,side,market:'win'});
let bets=[
{name:'Sunday fourfold',stake:2,odds:13.5,state:'open',legs:[leg('car','away'),leg('phi','away'),leg('min','away'),leg('gb','away')]},
{name:'Home double',stake:1,odds:7,state:'open',legs:[leg('car','home'),leg('phi','home')]},
{name:'Comebacks',stake:1,odds:5,state:'open',legs:[leg('car','home'),leg('min','away')]},
{name:'Packers & Panthers',stake:2,odds:3.2,state:'open',legs:[leg('gb','away'),leg('car','away')]},
{name:'Late double',stake:1,odds:4.8,state:'open',legs:[leg('kc','away'),leg('sea','home')]},
{name:'Cowboys & Eagles',stake:1,odds:4.5,state:'lost',legs:[leg('dal','away'),leg('phi','away')]},
{name:'Texans single',stake:2,odds:1.9,state:'won',legs:[leg('dal','home')]},
{name:'Cowboys & Chiefs',stake:1,odds:4,state:'lost',legs:[leg('dal','away'),leg('kc','away')]}];
const settings={scores:true,percent:true};
let draftName='',nameEdited=false;
let view='games',draft=[],expanded=new Set(),gameOpen=new Set(),backStack=[];
const prefs={feed:{scope:'My games',type:'All',bet:'All',sort:'Time',dir:-1,compact:false},games:{status:'All',linked:'All',health:'All',sort:'Kickoff',dir:1,compact:false,team:'All'},bets:{status:'Open',phase:'All',health:'All',size:'All',sort:'Chance',dir:-1,compact:false,team:'All'}};
function persist(){try{localStorage.setItem('endzone-v1',JSON.stringify({bets,draft,prefs,settings,draftName,nameEdited}));}catch(e){}}
try{const saved=JSON.parse(localStorage.getItem('endzone-v1')||'null');if(saved){if(Array.isArray(saved.bets)&&saved.bets.every(b=>Array.isArray(b.legs)&&b.legs.every(l=>games.some(g=>g.id===l.game))))bets=saved.bets;if(Array.isArray(saved.draft))draft=saved.draft.filter(l=>games.some(g=>g.id===l.game));draftName=typeof saved.draftName==='string'?saved.draftName:'';nameEdited=Boolean(saved.nameEdited);if(saved.settings)Object.assign(settings,saved.settings);if(saved.prefs)for(const v of ['games','bets','feed'])Object.assign(prefs[v],saved.prefs[v]||{});}}catch(e){}
window.endzoneBack=()=>{const sheet=[...root.querySelectorAll('.sheet')].find(s=>!s.hidden);if(sheet){sheet.hidden=true;return true;}if(backStack.length){root.querySelector('[data-back]')?.click();return true;}if(view!=='games'){view='games';render();return true;}return false;};
const game=id=>games.find(g=>g.id===id),code=(g,s)=>s==='away'?g.a:g.h,score=(g,s)=>s==='away'?g.as:g.hs;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'£'+n.toFixed(2),margin=l=>{const g=game(l.game);return score(g,l.side)-score(g,l.side==='away'?'home':'away');};
function signal(l){const g=game(l.game),d=margin(l);return{cls:g.state==='upcoming'?'future':d>0?'good':d<0?'bad':'pending',text:g.state==='upcoming'?'—':d>0?'+'+d:d<0?String(d):'0'};}
function probability(l){const g=game(l.game);return (l.side==='away'?g.p:100-g.p)/100;}
const chance=legs=>(settings.percent?Math.round(100*legs.reduce((p,l)=>p*probability(l),1)):Number((100*legs.reduce((p,l)=>p*probability(l),1)).toFixed(1)));
const betChance=b=>b.state==='lost'?0:b.state==='won'?100:chance(b.legs);
const linked=(id,side)=>bets.map((b,i)=>({...b,index:i})).filter(b=>b.state==='open'&&b.legs.some(l=>l.game===id&&(!side||l.side===side)));
const gap=b=>b.legs.reduce((n,l)=>n+(game(l.game).state!=='upcoming'&&margin(l)<=0?1-margin(l):0),0);
function record(b){const played=b.legs.filter(l=>game(l.game).state!=='upcoming');return [played.filter(l=>margin(l)>0).length,played.filter(l=>margin(l)<0).length,played.filter(l=>margin(l)===0).length];}
function strips(legs,context,points=false,compact=false){return `<span class="legpills ${compact?'minimalpills':''}">${legs.map(l=>{const s=signal(l),g=game(l.game),current=l.game===context;return `<span class="legpill ${current?'currentleg':''}" aria-label="${code(g,l.side)} ${g.state==='upcoming'?'upcoming':s.text+' point margin'}${current?', this game':''}">${compact?'':`<small>${code(g,l.side)}</small>`}<span class="pillmark ${s.cls}">${points&&!compact?s.text:''}</span></span>`;}).join('')}</span>`;}
function teamBets(id,side){const list=linked(id,side);return `<div class="teamlinks"><b class="teamlinkslabel">${code(game(id),side)}</b>${list.length?list.map(b=>`<button class="healthbet" data-jump="${b.index}"><span class="healthname">${esc(b.name)}</span><span class="healthmetrics"><b>${betChance(b)}%</b><span>${money(b.stake*b.odds)}</span></span>${strips(b.legs,id)}</button>`).join(''):'<small class="nolinks">—</small>'}</div>`;}
function gameDetails(id){return '<div class="teamcolumns">'+teamBets(id,'away')+teamBets(id,'home')+'</div>';}
function icons(){if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:16,height:16}});}
q('header').innerHTML='<b>ENDZONE</b><div class="headtools"><small>4 LIVE · DEMO</small><button class="refresh" aria-label="Refresh scores"><i data-lucide="refresh-cw"></i></button></div>';
q('nav').innerHTML='<button class="active" data-view="games">Games</button><button data-view="bets">Bets</button><button data-view="feed">Live</button>';
q('.games').insertAdjacentHTML('afterend','<div class="bets" hidden></div><div class="feed" hidden></div>');
q('.inputs').insertAdjacentHTML('beforebegin','<label class="betname">Name<input class="name" placeholder="My accumulator"></label>');
q('.app').insertAdjacentHTML('beforeend','<div class="sheet options" hidden><section class="panel"><div class="panelhead"><b class="optiontitle"></b><button class="close" aria-label="Close options"><i data-lucide="x"></i></button></div><div class="optionbody"></div><button class="continue optionsdone">Done</button></section></div>');
function gamePass(g){const p=prefs.games,list=linked(g.id);return (p.status==='All'||g.state===({Live:'live',Upcoming:'upcoming',Final:'final'})[p.status])&&(p.linked==='All'||(p.linked==='My games'?list.length>0:list.length===0))&&(p.health==='All'||(p.health==='Close'?g.state==='live'&&Math.abs(g.as-g.hs)<=7:list.some(b=>b.legs.some(l=>l.game===g.id&&margin(l)<0&&g.state==='live'))))&&(p.team==='All'||g.a===p.team||g.h===p.team);}
function betPass(b){const p=prefs.bets,r=record(b);return (p.status==='All'||b.state===p.status.toLowerCase())&&(p.phase==='All'||b.legs.some(l=>game(l.game).state===({Live:'live',Upcoming:'upcoming',Final:'final'})[p.phase]))&&(p.health==='All'||(p.health==='Behind'?r[1]>0:p.health==='Level'?r[2]>0:r[1]===0&&r[2]===0&&b.legs.every(l=>game(l.game).state!=='upcoming')))&&(p.size==='All'||(p.size==='Single'?b.legs.length===1:p.size==='2–3'?b.legs.length>=2&&b.legs.length<=3:b.legs.length>=4))&&(p.team==='All'||b.legs.some(l=>code(game(l.game),l.side)===p.team));}
function gameSort(g){const p=prefs.games;return p.sort==='Kickoff'?g.time:p.sort==='Bets'?linked(g.id).length:p.sort==='Points gap'?Math.abs(g.as-g.hs):p.sort==='Win %'?Math.max(g.p,100-g.p):linked(g.id).reduce((n,b)=>n+b.stake*b.odds,0);}
function betSort(b){const p=prefs.bets;return p.sort==='Chance'?betChance(b):p.sort==='Points gap'?gap(b):p.sort==='Return'?b.stake*b.odds:p.sort==='Stake'?b.stake:p.sort==='Legs'?b.legs.length:p.sort==='Name'?b.name.toLowerCase():b.index;}
function matchupRows(b){return b.legs.map(l=>{const g=game(l.game),s=signal(l);return `<button class="matchuprow" data-gamejump="${g.id}"><span><span class="${l.side==='away'?'chosenclub':''}">${g.a}</span> <b>${g.state==='upcoming'?'@':g.as+' - '+g.hs}</b> <span class="${l.side==='home'?'chosenclub':''}">${g.h}</span><small>${g.clock}</small></span><span class="matchupgap ${s.cls}">${g.state==='upcoming'?'—':margin(l)===0?'Level':s.text}<small>${Math.round(probability(l)*100)}%</small></span></button>`;}).join('');}
function betCard(b,compact){const r=record(b),future=b.legs.filter(l=>game(l.game).state==='upcoming').length,open=expanded.has(b.index),rec=`<span class="record" aria-label="Winning losing level"><b class="good">${r[0]}</b> - <b class="bad">${r[1]}</b> - <b class="pending">${r[2]}</b></span>`,status=b.state==='open'?betChance(b)+'%':b.state==='won'?'Won':'Lost';let body;if(compact)body=`<button class="bethead" data-bet="${b.index}"><span><strong>${esc(b.name)}</strong><small>${money(b.stake)} → ${money(b.stake*b.odds)}</small></span><span class="betprob">${status}</span></button>${strips(b.legs,null,false,true)}<div class="betfoot">${rec}<span>${gap(b)} pts</span></div>`;else body=`<button class="splithead" data-bet="${b.index}" aria-expanded="${open}"><span class="splitnumber"><b class="betprob ${b.state==='lost'?'bad':b.state==='won'?'good':''}">${status}</b>${rec}</span><span class="splittext"><strong>${esc(b.name)}</strong><span class="splitmeta"><span>${money(b.stake)} → ${money(b.stake*b.odds)}</span><span>${b.state==='open'?(b.legs.every(l=>game(l.game).state==='upcoming')?'—':gap(b))+' pts':b.state==='won'?'Settled':'Closed'}</span></span>${future?`<small>${future} upcoming</small>`:''}</span></button><div class="splitpills">${b.legs.map(l=>{const g=game(l.game),sg=signal(l);return `<button class="splitpick" data-gamejump="${g.id}"><small class="selectedclub">${code(g,l.side)}</small><span class="pillmark ${sg.cls}">${sg.text}</span><small>v ${code(g,l.side==='away'?'home':'away')}</small><small class="splitscore">${g.state==='upcoming'?'@':g.as+' - '+g.hs}</small></button>`;}).join('')}</div>`;return `<article data-betcard="${b.index}">${b
