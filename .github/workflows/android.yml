name: Endzone Friends APK
on:
  push:
    branches: [friends-edition]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: .signing/endzone-debug.keystore
          key: endzone-development-signing-v2
      - name: Ensure persistent development signing key
        run: |
          mkdir -p .signing
          if [ ! -f .signing/endzone-debug.keystore ]; then
            keytool -genkeypair -keystore .signing/endzone-debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify packaged HTML
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              assert apk.read('assets/index.html') == Path('app/src/main/assets/index.html').read_bytes()
          PY
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Endzone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Endzone-Friends-APK
          path: Endzone.apk
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="friends-${{ github.run_number }}"
          gh release create "$tag" Endzone.apk --target "$GITHUB_SHA" --title "Endzone Friends build ${{ github.run_number }}" --notes "Simple Endzone friends edition. Track accumulators made from team-winner selections. Saved bets stay on this device."
