name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: endzone-development-signing-v1
      - name: Build and lint
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Endzone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Endzone-APK
          path: Endzone.apk
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${{ github.run_number }}"
          gh release create "$tag" Endzone.apk --target "$GITHUB_SHA" --title "Endzone Android build ${{ github.run_number }}" --notes "Install Endzone.apk on Android. Development build of the approved Games, Bets and Live Feed prototype. Scores/events are demo data; saved bets stay on this device."
